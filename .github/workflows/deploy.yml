name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies and build
        working-directory: SCRUM-N3-ADMON-EQ6-main
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm test
          corepack pnpm astro check
          corepack pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: SCRUM-N3-ADMON-EQ6-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
